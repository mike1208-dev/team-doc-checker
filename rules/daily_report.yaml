# ZeeChecker v1 rules for daily reports
name: Daily report
description: What I did yesterday, what I'll do today, and what is blocking me.

# Words that suggest a document is this style (used by "Auto-detect")
detect: ["daily report", "yesterday", "weekend", "today", "blockers"]

rules:
  - id: has_sections
    title: Has Yesterday / Today / Blockers sections
    check: required_sections
    sections:
      - ["Yesterday", "Weekend"]
      - ["Today"]
      - ["Blockers", "Notes"]

  - id: tags_reviewer
    title: Tags the reviewer at the top
    check: mention_at_top

  - id: has_hours
    title: Gives working hours for Yesterday and Today
    check: working_hours
    sections:
      - ["Yesterday", "Weekend"]
      - ["Today"]

  - id: concrete_tasks
    title: Each task says what was done or will be done
    check: llm
    question: "Does each task say concretely what was done or will be done (not vague, like 'Worked on the login page')?"

  - id: status_or_result
    title: Each finished task has a status or result
    check: llm
    question: "Does each finished task (under Yesterday or Weekend) have a status or result, such as Merged, In review, a PR link or a number?"

  - id: overall_progress
    title: Says the overall progress
    check: llm
    question: "Does the report say how far the overall work is, or what is left to do?"

  - id: clear_and_short
    title: Clear and short
    check: llm
    question: "Is the report easy to read, with no repeated lines and no needless detail?"

  - id: terms_explained
    title: Unclear terms are explained
    check: llm
    question: "Are abbreviations and unclear terms explained?"

  - id: real_blockers
    title: Blockers are stated clearly
    check: llm
    question: "Are blockers stated clearly, with 'None' used only when the report mentions no problem that blocks the work?"
